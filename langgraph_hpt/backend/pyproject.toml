[project]
name = "hpt-agent-backend"
version = "0.1.0"
description = "LangGraph backend for HPT workflows with plugin objective support."
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.6",
    "fastapi>=0.110.0",
    "numpy>=1.24.0"
]

[project.optional-dependencies]
hebo = ["HEBO>=0.3.5"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

